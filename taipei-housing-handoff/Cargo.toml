[package]
name = "taipei-housing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "taipei-housing"
path = "src/main.rs"

[[bin]]
name = "import-json"
path = "src/bin/import_json.rs"

[dependencies]
# --- 核心 / 資料庫（待辦①）---
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# --- 抓取層（待辦②③：591無公開API，改用headless browser直接讀DOM）---
headless_chrome = { version = "1.0.22", features = ["fetch"] }
which = "8.0.6"

# --- 排程 + Web 前端（待辦④）---
tokio-cron-scheduler = "0.15.1"
axum = "0.8.9"
askama = "0.16.0"
chrono-tz = "0.10.4"

# --- 通知（待辦⑤再啟用）---
# lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
